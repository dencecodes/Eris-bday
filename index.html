<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8b4bc">
<meta name="description" content="A birthday gift, made just for her.">
<title>Happy Birthday, My Love ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* ===================== RESET & BASE ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cormorant Garamond', serif;
  background: var(--cream);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { max-width: 100%; display: block; }
input { font: inherit; }

:root {
  --blush: #f6d9d9;
  --blush-light: #fbeaea;
  --soft-rose: #e8b4bc;
  --rose-deep: #d9909e;
  --dusty-pink: #c98a93;
  --peach: #f3d9c4;
  --peach-light: #fbead9;
  --cream: #fdf8f2;
  --cream-deep: #f7eee2;
  --burgundy: #6b2c39;
  --burgundy-soft: #8c4655;
  --champagne: #e8d9bc;
  --gold: #c6a15b;
  --gold-light: #e3cd9a;
  --white-soft: #fffdfb;
  --ink: #4a2e33;
  --pop-pink: #e23e77;
}

/* ===================== SCENE LAYOUT ===================== */
.scene {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 9vh 6vw;
  text-align: center;
  gap: clamp(24px, 4.5vh, 46px);
}

.sprite-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ===================== SCROLL REVEAL ===================== */
.reveal {
  opacity: 0;
  transform: translateY(36px);
  transition: opacity 1.1s cubic-bezier(.22,.61,.36,1), transform 1.1s cubic-bezier(.22,.61,.36,1);
}
.reveal.is-visible { opacity: 1; transform: translateY(0); }

/* ===================== TYPOGRAPHY ===================== */
.script-heading {
  font-family: 'Parisienne', cursive;
  font-size: clamp(2.4rem, 8vw, 4.6rem);
  color: var(--burgundy);
  line-height: 1.25;
  text-shadow: 0 2px 30px rgba(255,255,255,0.6);
  position: relative;
  z-index: 2;
}
.heart-glyph { color: inherit; }

.caption {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.15rem, 3.4vw, 1.7rem);
  color: var(--burgundy);
  letter-spacing: 0.02em;
  line-height: 1.5;
  position: relative;
  z-index: 2;
}
.caption--small {
  font-size: clamp(0.85rem, 2.2vw, 1.05rem);
  color: var(--burgundy-soft);
  margin-top: 1.4em;
  letter-spacing: 0.03em;
}

/* ===================== PHOTO SLOTS ===================== */
.photo-slot {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(155deg, var(--peach-light), var(--blush));
  cursor: pointer;
}
.photo-slot__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .7s ease;
}
.photo-slot.has-image .photo-slot__img { opacity: 1; }
.photo-slot--fixed { cursor: default; }
.photo-slot.has-image .photo-slot__placeholder { opacity: 0; pointer-events: none; }
.photo-slot__placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--dusty-pink);
  transition: opacity .4s ease;
  padding: 10%;
  text-align: center;
}
.photo-slot__placeholder svg { width: clamp(20px, 16%, 38px); height: auto; opacity: 0.75; }
.photo-slot__placeholder span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.66rem, 2.5vw, 0.82rem);
  letter-spacing: 0.05em;
}
.photo-slot__input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

/* ===================== PORTRAIT FRAMES ===================== */
.portrait-frame-wrap { position: relative; z-index: 2; display: flex; justify-content: center; }
.portrait-frame { position: relative; animation: float-gentle 6.5s ease-in-out infinite; }
.portrait-frame .photo-slot { overflow: hidden; }

.portrait-frame--garden { width: min(52vw, 290px); aspect-ratio: 1/1; }
.portrait-frame--garden .photo-slot { border-radius: 50%; box-shadow: 0 20px 50px -10px rgba(107,44,57,0.35), 0 0 0 8px var(--cream-deep), 0 0 0 9px var(--gold); }

.portrait-frame--finale { width: min(58vw, 330px); aspect-ratio: 3/4; }
.portrait-frame--finale .photo-slot { border-radius: 50% 50% 6% 6% / 38% 38% 4% 4%; box-shadow: 0 25px 55px -14px rgba(107,44,57,0.4), 0 0 0 1px rgba(198,161,91,0.5); }

@keyframes float-gentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

/* ===================== AMBIENT DECOR: PETALS / PARTICLES / BUTTERFLIES ===================== */
.petals-container, .particles-container, .butterflies-container {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1;
}
.petal { position: absolute; top: -10%; height: auto; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes fall {
  0% { transform: translate(0, -10vh) rotate(0deg); }
  50% { transform: translate(3vw, 55vh) rotate(190deg); }
  100% { transform: translate(-3vw, 120vh) rotate(360deg); }
}

.particle {
  position: absolute; bottom: -5%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.95), var(--gold-light) 45%, transparent 72%);
  filter: blur(0.5px);
  animation-name: drift-up; animation-timing-function: linear; animation-iteration-count: infinite;
}
@keyframes drift-up {
  0% { transform: translate(0,0); opacity: 0; }
  12% { opacity: 0.85; }
  88% { opacity: 0.5; }
  100% { transform: translate(2vw, -105vh); opacity: 0; }
}

.butterfly-wrap { position: absolute; pointer-events: none; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.butterfly-wrap.flight-a { animation-name: flight-a; }
.butterfly-wrap.flight-b { animation-name: flight-b; }
.butterfly-svg { width: 100%; height: auto; display: block; }
.butterfly-svg path, .butterfly-svg .body { fill: currentColor; }
.wings-left, .wings-right { transform-box: fill-box; transform-origin: center right; animation: flutter 0.55s ease-in-out infinite; }
.wings-right { transform-origin: center left; }
@keyframes flutter { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.45); } }
@keyframes flight-a {
  0% { transform: translate(0,0) rotate(-6deg); }
  25% { transform: translate(70px,-50px) rotate(10deg); }
  50% { transform: translate(140px,15px) rotate(-8deg); }
  75% { transform: translate(75px,70px) rotate(8deg); }
  100% { transform: translate(0,0) rotate(-6deg); }
}
@keyframes flight-b {
  0% { transform: translate(0,0) rotate(6deg); }
  25% { transform: translate(-65px,40px) rotate(-9deg); }
  50% { transform: translate(-125px,-20px) rotate(7deg); }
  75% { transform: translate(-60px,-65px) rotate(-6deg); }
  100% { transform: translate(0,0) rotate(6deg); }
}

/* ===================== SMALL DECORATIVE ICONS ===================== */
.deco-icon { position: absolute; pointer-events: none; z-index: 1; }
.deco-icon svg { width: 100%; height: auto; display: block; }
.deco-icon--float { animation: float-gentle 5s ease-in-out infinite; }
.deco-icon--twinkle { animation: sparkle-twinkle 2.4s ease-in-out infinite; }
@keyframes sparkle-twinkle { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

.pearls-strand { position: absolute; width: clamp(140px, 30vw, 220px); color: var(--champagne); z-index: 1; pointer-events: none; opacity: 0.85; }
.pearls-strand svg { width: 100%; height: auto; display: block; }

/* ===================== BIRTHDAY CARD (portrait / landscape) ===================== */
.card-scene {
  background:
    radial-gradient(ellipse 60% 40% at 28% 78%, rgba(255,255,255,0.4), transparent 60%),
    radial-gradient(ellipse 55% 45% at 78% 18%, rgba(255,255,255,0.32), transparent 60%),
    linear-gradient(165deg, var(--blush-light) 0%, var(--blush) 55%, var(--soft-rose) 100%);
}

.card-balloon-cluster { position: absolute; pointer-events: none; z-index: 1; width: 40%; }
.card-balloon-cluster--tl { top: -2%; left: -5%; }
.card-balloon-cluster--br { bottom: -2%; right: -5%; }
.card-balloon { position: absolute; }
.card-balloon svg { width: 100%; height: auto; display: block; }
.card-balloon--1 { width: 62%; top: 0; left: 30%; z-index: 3; }
.card-balloon--2 { width: 54%; top: 20%; left: 0; z-index: 2; }
.card-balloon--3 { width: 42%; top: 44%; left: 10%; z-index: 1; opacity: 0.95; }

.card-sparkle { position: absolute; z-index: 2; pointer-events: none; }
.card-sparkle svg { width: 100%; height: auto; display: block; }
.card-sparkle--1 { top: 11%; left: 46%; width: 3.6%; color: var(--pop-pink); }
.card-sparkle--2 { top: 32%; right: 9%; width: 3.2%; color: var(--pop-pink); }
.card-sparkle--3 { bottom: 21%; left: 7%; width: 4%; color: var(--rose-deep); }

.card-content {
  position: relative;
  z-index: 3;
  width: 100%;
  display: grid;
  grid-template-areas: "heading" "photo";
  grid-template-columns: 1fr;
  gap: clamp(20px, 4vh, 38px);
  align-items: center;
}
.card-heading { grid-area: heading; text-align: right; line-height: 1; justify-self: end; position: relative; }
.card-heading .word-happy {
  display: block;
  font-family: 'Parisienne', cursive;
  font-size: clamp(2.1rem, 9.5vw, 3.8rem);
  color: var(--soft-rose);
}
.card-heading .word-birthday {
  display: block;
  font-family: 'Parisienne', cursive;
  font-size: clamp(3.8rem, 20vw, 7.2rem);
  color: var(--pop-pink);
  margin-top: -0.12em;
}

.card-polaroid-wrap { grid-area: photo; }
.card-polaroid {
  position: relative;
  width: min(63vw, 364px);
  background: var(--white-soft);
  padding: 4.5% 4.5% 15%;
  transform: rotate(-1.6deg);
  box-shadow: 0 2vmin 3.5vmin rgba(107,44,57,0.3);
}
.card-polaroid .photo-slot { aspect-ratio: 1 / 1.02; }
.card-polaroid-name {
  position: absolute;
  bottom: 3.5%;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Parisienne', cursive;
  font-size: clamp(1.2rem, 5.2vw, 1.9rem);
  color: var(--pop-pink);
}

/* ===================== CARD: ENTRANCE, AMBIENT MOTION & DECORATION ===================== */

/* Heading: letters rise in one by one, then ripple gently */
.card-heading .letter { display: inline-block; opacity: 0; }
.card-heading.is-visible .letter {
  animation:
    letter-rise .95s cubic-bezier(.34,1.56,.64,1) both,
    letter-wave 3.8s ease-in-out infinite;
  animation-delay:
    calc(var(--n) * 75ms + .25s),
    calc(var(--n) * 90ms + 2.2s);
}
@keyframes letter-rise {
  from { opacity: 0; transform: translateY(.55em) rotate(-10deg) scale(.55); }
  to   { opacity: 1; transform: none; }
}
@keyframes letter-wave {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-.05em); }
}

/* Hand-drawn gold swash that draws itself under "Birthday" */
.card-flourish { display: block; width: 88%; height: auto; margin: 2px 0 0 auto; overflow: visible; }
.card-flourish path {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}
.card-heading.is-visible .card-flourish path { animation: draw-line 1.5s ease-out 1.7s forwards; }
@keyframes draw-line { to { stroke-dashoffset: 0; } }

/* Twinkles around the heading */
.heading-sparkle { position: absolute; pointer-events: none; color: var(--gold); animation: sparkle-twinkle 2.6s ease-in-out infinite; }
.heading-sparkle svg { width: 100%; height: auto; display: block; }

/* Balloons rise into the scene, then bob and sway on their strings */
.card-balloon-cluster { animation: balloon-rise 2.2s cubic-bezier(.22,.8,.3,1) both; }
.card-balloon-cluster--br { animation-delay: .35s; }
@keyframes balloon-rise {
  from { transform: translateY(70vh); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.card-balloon { transform-origin: 50% 100%; animation: balloon-bob 6.4s ease-in-out infinite; }
.card-balloon--2 { animation-duration: 7.6s; animation-delay: -2s; }
.card-balloon--3 { animation-duration: 5.6s; animation-delay: -4s; }
.card-balloon-cluster--br .card-balloon { animation-direction: reverse; }
@keyframes balloon-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-14px) rotate(2deg); }
}

/* Card sparkles twinkle */
.card-sparkle { animation: sparkle-twinkle 2.6s ease-in-out infinite; }
.card-sparkle--2 { animation-delay: -.9s; }
.card-sparkle--3 { animation-delay: -1.7s; }

/* Polaroid hangs from its tape and swings a little */
.card-polaroid { transform-origin: 50% 0; animation: polaroid-sway 8s ease-in-out infinite; }
@keyframes polaroid-sway {
  0%, 100% { transform: rotate(-2.8deg); }
  50%      { transform: rotate(-.4deg); }
}
.card-polaroid::before {
  content: '';
  position: absolute;
  top: -3.4%;
  left: 50%;
  width: 34%;
  height: 7.5%;
  transform: translateX(-50%) rotate(-3deg);
  background: repeating-linear-gradient(45deg, rgba(232,180,188,.9) 0 6px, rgba(253,248,242,.9) 6px 12px);
  box-shadow: 0 1px 3px rgba(107,44,57,.18);
  z-index: 2;
  pointer-events: none;
}
.card-polaroid-bow {
  position: absolute;
  right: -8%;
  bottom: -5%;
  width: 24%;
  color: var(--pop-pink);
  z-index: 2;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(107,44,57,.22));
  animation: bow-wiggle 4.2s ease-in-out infinite;
}
.card-polaroid-bow svg { width: 100%; height: auto; display: block; }
@keyframes bow-wiggle {
  0%, 100% { transform: rotate(12deg) scale(1); }
  50%      { transform: rotate(19deg) scale(1.07); }
}

/* Roses turn slowly, sprigs sway, outline hearts beat */
.deco-icon--spin svg { animation: spin-slow 44s linear infinite; }
@keyframes spin-slow { to { transform: rotate(360deg); } }

.deco-sprig {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  width: clamp(46px, 12vw, 90px);
  color: var(--dusty-pink);
  opacity: .55;
  transform-origin: 50% 100%;
  animation: sprig-sway 6s ease-in-out infinite;
}
.deco-sprig svg { width: 100%; height: auto; display: block; }
@keyframes sprig-sway {
  0%, 100% { transform: scaleX(var(--flip, 1)) rotate(-3deg); }
  50%      { transform: scaleX(var(--flip, 1)) rotate(4deg); }
}

.deco-heart { position: absolute; z-index: 1; pointer-events: none; animation: heart-beat 2.8s ease-in-out infinite; }
.deco-heart svg { width: 100%; height: auto; display: block; }
@keyframes heart-beat {
  0%, 60%, 100% { transform: scale(1) rotate(var(--tilt, 0deg)); opacity: .7; }
  12%           { transform: scale(1.2) rotate(var(--tilt, 0deg)); opacity: 1; }
  26%           { transform: scale(1.02) rotate(var(--tilt, 0deg)); }
  38%           { transform: scale(1.14) rotate(var(--tilt, 0deg)); opacity: 1; }
}

/* Falling petals + butterflies (spawned by script) */
.petal svg { width: 100%; height: auto; display: block; }
.card-scene .butterflies-container { z-index: 4; }

/* Tap anywhere on the card for a burst of hearts */
.burst-heart {
  position: absolute;
  z-index: 6;
  pointer-events: none;
  line-height: 1;
  font-size: var(--s, 20px);
  transform: translate(-50%, -50%);
  animation: heart-burst 1.7s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes heart-burst {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0deg); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); }
}

@media (orientation: landscape) {
  .card-balloon-cluster { width: 22%; }
  .card-balloon-cluster--tl { top: -4%; left: -3%; }
  .card-balloon-cluster--br { bottom: -4%; right: -3%; }

  .card-sparkle--1 { top: 9%; left: 47%; width: 2.2%; }
  .card-sparkle--2 { top: 14%; right: 6%; width: 2%; color: var(--rose-deep); }
  .card-sparkle--3 { bottom: 12%; left: 40%; width: 2.4%; }

  .card-content {
    grid-template-areas: "photo heading";
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: clamp(28px, 5vw, 64px);
    max-width: 1000px;
  }
  .card-heading { text-align: left; align-self: center; justify-self: start; }
  .card-flourish { margin-left: 0; }
  .card-heading .word-happy { font-size: clamp(1.8rem, 5.6vw, 3.2rem); }
  .card-heading .word-birthday { font-size: clamp(3rem, 10vw, 7rem); }
  /* bigger photo in landscape: sized against viewport height, the dimension landscape actually constrains */
  .card-polaroid { width: clamp(260px, 42vh, 460px); }
  .card-polaroid-name { font-size: clamp(1rem, 3.4vw, 1.5rem); }
}

.scroll-indicator { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.scroll-indicator__line { width: 1px; height: 44px; background: rgba(107,44,57,0.22); position: relative; overflow: hidden; }
.scroll-indicator__line::after { content: ''; position: absolute; top: -44px; left: 0; width: 100%; height: 44px; background: var(--gold); animation: scroll-line 2.2s ease-in-out infinite; }
@keyframes scroll-line { 0% { top: -44px; } 100% { top: 44px; } }
.scroll-indicator__label { font-family: 'Cormorant Garamond', serif; font-style: italic; letter-spacing: 0.32em; text-transform: uppercase; font-size: 0.66rem; color: var(--burgundy-soft); }

/* ===================== PORTRAIT / EDITORIAL SCENE ===================== */
.portrait-scene {
  background: linear-gradient(180deg, var(--soft-rose) 0%, var(--blush-light) 55%, var(--cream) 100%);
}

/* =========================================================
   MAGICAL SURPRISE FLOWERS
   ========================================================= */

.surprise-block {
  position: relative;
  z-index: 3;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;
}


/* ---------------------------------------------------------
   Heading
   --------------------------------------------------------- */

.surprise-heading {
  margin: 0;

  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 500;

  font-size: clamp(1.15rem, 2.8vw, 1.55rem);

  color: var(--burgundy-soft);

  letter-spacing: 0.025em;
  text-align: center;

  text-shadow:
    0 2px 12px rgba(255,255,255,.7);
}


/* ---------------------------------------------------------
   Decorative divider
   --------------------------------------------------------- */

.surprise-divider {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 13px;

  margin-bottom: 28px;
}

.surprise-divider span {
  width: 70px;
  height: 1px;

  background: linear-gradient(
    to right,
    transparent,
    rgba(180,95,116,.55)
  );
}

.surprise-divider span:last-child {
  background: linear-gradient(
    to left,
    transparent,
    rgba(180,95,116,.55)
  );
}

.surprise-divider i {
  font-family: serif;
  font-style: normal;

  font-size: 15px;

  color: #c8798b;

  animation: tiny-heart 2.5s ease-in-out infinite;
}


/* ---------------------------------------------------------
   Flower container
   --------------------------------------------------------- */

.surprise-flowers {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: clamp(24px, 5vw, 58px);

  width: 100%;
  max-width: 760px;

  flex-wrap: wrap;
}


/* ---------------------------------------------------------
   Flower button
   --------------------------------------------------------- */

.surprise-flower {
  --flower-color: #e994a7;
  --flower-light: #ffc8d3;
  --flower-dark: #c96f86;

  position: relative;

  width: clamp(86px, 13vw, 118px);
  height: clamp(86px, 13vw, 118px);

  padding: 0;

  border: 0;
  background: transparent;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  isolation: isolate;

  transition:
    transform .5s cubic-bezier(.34,1.56,.64,1);
}


/* ---------------------------------------------------------
   Different flower colors
   --------------------------------------------------------- */

.surprise-flower--pink {
  --flower-color: #ed91a5;
  --flower-light: #ffc9d4;
  --flower-dark: #c8667f;
}

.surprise-flower--champagne {
  --flower-color: #e4bc72;
  --flower-light: #f8e5b7;
  --flower-dark: #c89543;
}

.surprise-flower--lilac {
  --flower-color: #d99ac5;
  --flower-light: #f1c8e0;
  --flower-dark: #b86e9f;
}



/* ---------------------------------------------------------
   Soft glowing background
   --------------------------------------------------------- */

.surprise-flower::before {
  content: "";

  position: absolute;

  width: 78%;
  height: 78%;

  border-radius: 50%;

  background: var(--flower-color);

  filter: blur(22px);

  opacity: .20;

  z-index: -2;

  transition:
    transform .5s ease,
    opacity .5s ease;
}


/* ---------------------------------------------------------
   Orbit rings
   --------------------------------------------------------- */

.flower-orbit {
  position: absolute;

  width: 94%;
  height: 42%;

  border: 1.5px solid var(--flower-color);

  border-radius: 50%;

  transform: rotate(-28deg);

  opacity: .65;

  z-index: 0;

  transition:
    transform .6s ease,
    opacity .5s ease;
}

.flower-orbit--second {
  width: 72%;
  height: 35%;

  transform: rotate(35deg);

  opacity: .28;

  border-width: 1px;
}


/* ---------------------------------------------------------
   Flower petals
   --------------------------------------------------------- */

.flower-petals {
  position: absolute;

  width: 74%;
  height: 74%;

  left: 13%;
  top: 13%;

  transform-origin: center;

  transition:
    transform .6s cubic-bezier(.34,1.56,.64,1);
}


/* Individual petals */

.flower-petals span {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 39%;
  height: 57%;

  transform-origin: 50% 82%;

  border-radius:
    55% 55% 48% 48% /
    68% 68% 40% 40%;

  background:
    radial-gradient(
      circle at 45% 20%,
      var(--flower-light) 0%,
      var(--flower-color) 48%,
      var(--flower-dark) 100%
    );

  box-shadow:
    inset 0 -4px 7px rgba(120,40,60,.08),
    0 5px 9px rgba(100,40,60,.12);

  transform:
    translate(-50%, -82%)
    rotate(calc(var(--i) * 60deg));
}


/* Assign petal rotations */

.flower-petals span:nth-child(1) {
  --i: 0;
}

.flower-petals span:nth-child(2) {
  --i: 1;
}

.flower-petals span:nth-child(3) {
  --i: 2;
}

.flower-petals span:nth-child(4) {
  --i: 3;
}

.flower-petals span:nth-child(5) {
  --i: 4;
}

.flower-petals span:nth-child(6) {
  --i: 5;
}


/* ---------------------------------------------------------
   Flower center
   --------------------------------------------------------- */

.flower-center {
  position: absolute;

  width: 25%;
  aspect-ratio: 1;

  border-radius: 50%;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fffdf6 0%,
      #f9e7c4 35%,
      #d8a85c 100%
    );

  border: 3px solid rgba(255,255,255,.8);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.20),
    0 4px 12px rgba(122,65,76,.22);
}


/* Pearl highlight */

.flower-center::before {
  content: "";

  position: absolute;

  width: 28%;
  height: 28%;

  top: 15%;
  left: 20%;

  border-radius: 50%;

  background: rgba(255,255,255,.9);

  filter: blur(1px);
}


/* Heart */

.center-heart {
  position: relative;

  z-index: 2;

  color: #b65d72;

  font-size: clamp(9px, 1.5vw, 14px);

  transform: translateY(1px);

  text-shadow:
    0 1px 3px rgba(100,40,50,.15);
}


/* ---------------------------------------------------------
   Sparkles
   --------------------------------------------------------- */

.flower-sparkle {
  position: absolute;

  z-index: 8;

  color: var(--flower-dark);

  pointer-events: none;

  line-height: 1;

  text-shadow:
    0 0 8px rgba(255,255,255,.8);

  animation:
    flower-sparkle-float 2.4s ease-in-out infinite;
}

.sparkle-one {
  top: 2%;
  right: 8%;

  font-size: 14px;
}

.sparkle-two {
  bottom: 9%;
  left: 4%;

  font-size: 10px;

  animation-delay: -.8s;
}

.sparkle-three {
  top: 20%;
  left: 5%;

  font-size: 20px;

  animation-delay: -1.5s;
}


/* ---------------------------------------------------------
   Hover interaction
   --------------------------------------------------------- */

.surprise-flower:hover {
  transform:
    translateY(-8px)
    scale(1.08);
}

.surprise-flower:hover::before {
  transform: scale(1.35);

  opacity: .38;
}

.surprise-flower:hover .flower-petals {
  transform: scale(1.12) rotate(5deg);
}

.surprise-flower:hover .flower-orbit {
  transform:
    rotate(-18deg)
    scale(1.12);

  opacity: .95;
}

.surprise-flower:hover .flower-orbit--second {
  transform:
    rotate(48deg)
    scale(1.15);

  opacity: .55;
}

.surprise-flower:hover .flower-center {
  box-shadow:
    0 0 0 5px rgba(255,255,255,.3),
    0 0 22px var(--flower-color),
    0 4px 15px rgba(122,65,76,.22);
}


/* ---------------------------------------------------------
   Click animation
   --------------------------------------------------------- */

.surprise-flower.is-open {
  animation: flower-open .65s cubic-bezier(.34,1.56,.64,1);
}

.surprise-flower.is-open .flower-petals {
  transform: scale(1.28);

  transition:
    transform .65s cubic-bezier(.34,1.56,.64,1);
}

.surprise-flower.is-open .flower-center {
  transform: scale(1.15);

  box-shadow:
    0 0 35px var(--flower-color);
}


/* ---------------------------------------------------------
   Focus accessibility
   --------------------------------------------------------- */

.surprise-flower:focus-visible {
  outline: none;

  box-shadow:
    0 0 0 3px rgba(255,255,255,.9),
    0 0 0 6px rgba(191,111,130,.55);

  border-radius: 50%;
}


/* ---------------------------------------------------------
   Animations
   --------------------------------------------------------- */

@keyframes flower-sparkle-float {

  0%,
  100% {
    transform: scale(.8) rotate(0deg);
    opacity: .45;
  }

  50% {
    transform: scale(1.25) rotate(15deg);
    opacity: 1;
  }

}

@keyframes tiny-heart {

  0%,
  100% {
    transform: scale(1);
    opacity: .7;
  }

  50% {
    transform: scale(1.18);
    opacity: 1;
  }

}

@keyframes flower-open {

  0% {
    transform: scale(1);
  }

  35% {
    transform: scale(1.18) rotate(-4deg);
  }

  70% {
    transform: scale(.95) rotate(3deg);
  }

  100% {
    transform: scale(1);
  }

}


/* ---------------------------------------------------------
   Mobile
   --------------------------------------------------------- */

@media (max-width: 600px) {

  .surprise-block {
    gap: 8px;
  }

  .surprise-divider {
    margin-bottom: 18px;
  }

  .surprise-divider span {
    width: 45px;
  }

  .surprise-flowers {
    gap: 14px 18px;
    max-width: 330px;
  }

  .surprise-flower {
    width: 82px;
    height: 82px;
  }

}


/* Very small phones */

@media (max-width: 360px) {

  .surprise-flower {
    width: 72px;
    height: 72px;
  }

  .surprise-flowers {
    gap: 10px;
  }

}

/* ===================== 2ND SLIDE: ENTRANCE, AMBIENT MOTION & DECORATION ===================== */

/* heading: the words rise in one by one, the divider draws itself outward from the heart */
.surprise-heading .sw { display: inline-block; opacity: 0; transform: translateY(14px); }
.surprise-block.is-visible .surprise-heading .sw { animation: word-rise .9s calc(.2s + var(--n) * .13s) ease-out forwards; }
@keyframes word-rise { to { opacity: 1; transform: none; } }

.surprise-divider span { transform: scaleX(0); }
.surprise-divider span:first-child { transform-origin: 100% 50%; }
.surprise-divider span:last-child { transform-origin: 0 50%; }
.surprise-block.is-visible .surprise-divider span { animation: line-grow 1.1s 1.2s cubic-bezier(.22,.8,.3,1) forwards; }
@keyframes line-grow { to { transform: scaleX(1); } }

/* soft light pulsing behind the row of flowers */
.surprise-flowers { position: relative; }
.surprise-flowers::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: min(100%, 680px);
  height: 150%;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(255,255,255,.7), rgba(255,255,255,0) 68%);
  z-index: -1;
  pointer-events: none;
  animation: row-glow 5s ease-in-out infinite;
}
@keyframes row-glow { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* flowers pop in one after another, then float gently (uses the separate "translate" property so hover still works) */
.surprise-flower:nth-child(1) { --k: 0; }
.surprise-flower:nth-child(2) { --k: 1; }
.surprise-flower:nth-child(3) { --k: 2; }
.surprise-block.is-visible .surprise-flower {
  animation: flower-pop 1s cubic-bezier(.34,1.56,.64,1) backwards, flower-bob 5.5s ease-in-out infinite;
  animation-delay: calc(1.4s + var(--k) * .22s), calc(var(--k) * -1.7s);
}
.surprise-block.is-visible .surprise-flower.is-open { animation: flower-open .65s cubic-bezier(.34,1.56,.64,1); }
@keyframes flower-pop { from { opacity: 0; transform: translateY(34px) scale(.3) rotate(-25deg); } }
@keyframes flower-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }

/* petals and orbit rings turn slowly, the little hearts beat */
.flower-petals { animation: petals-spin 28s linear infinite; }
.surprise-flower:nth-child(even) .flower-petals { animation-direction: reverse; }
@keyframes petals-spin { to { rotate: 360deg; } }
.flower-orbit { animation: orbit-spin 16s linear infinite; }
.flower-orbit--second { animation-duration: 23s; animation-direction: reverse; }
@keyframes orbit-spin { to { rotate: 360deg; } }
.center-heart { animation: center-beat 2.4s ease-in-out infinite; }
@keyframes center-beat { 0%, 60%, 100% { scale: 1; } 20% { scale: 1.3; } 40% { scale: 1.1; } }

/* garland of little hearts across the top (hearts are added by the script) */
.garland {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: clamp(64px, 11vw, 130px);
  z-index: 2;
  pointer-events: none;
  transform-origin: 50% 0;
  animation: garland-sway 7s ease-in-out infinite;
}
.garland > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.garland > svg path { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .8; }
.garland__heart {
  position: absolute;
  width: var(--hs, 22px);
  transform: translate(-50%, 0);
  transform-origin: 50% 0;
  animation: heart-swing var(--t, 4s) ease-in-out var(--d, 0s) infinite alternate;
}
.garland__heart::before { content: ''; position: absolute; left: 50%; top: -6px; width: 1px; height: 8px; background: var(--gold); }
.garland__heart svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 3px rgba(107,44,57,.2)); }
@keyframes garland-sway { 0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); } }
@keyframes heart-swing {
  from { transform: translate(-50%, 0) rotate(-9deg); }
  to   { transform: translate(-50%, 0) rotate(9deg); }
}

/* the ribbon bow wiggles; hearts rise from the bottom; butterflies fly over the flowers */
.deco-icon--wiggle { transform-origin: 50% 60%; animation: deco-wiggle 4.6s ease-in-out infinite; }
@keyframes deco-wiggle {
  0%, 100% { transform: rotate(-7deg) scale(1); }
  50%      { transform: rotate(7deg) scale(1.07); }
}
.rise-heart { position: absolute; bottom: -6%; line-height: 1; opacity: 0; animation: rise-heart linear infinite; }
@keyframes rise-heart {
  0%   { transform: translate(0,0) scale(.6); opacity: 0; }
  10%  { opacity: .55; }
  50%  { transform: translate(2vw,-55vh) scale(1); }
  100% { transform: translate(-2vw,-115vh) scale(.8); opacity: 0; }
}
.portrait-scene .butterflies-container { z-index: 4; }

/* a slide that is scrolled out of view stops animating (saves battery) */
.scene.is-paused *, .scene.is-paused *::before, .scene.is-paused *::after { animation-play-state: paused !important; }

.loader--boot { animation: loader-failsafe .01s 9s forwards; }
@keyframes loader-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }

@keyframes loader-bloom {

}

.loader__title {

}
.loader__dots i { display: inline-block; font-style: normal; animation: loader-dot 1.4s ease-in-out infinite; }
.loader__dots i:nth-child(2) { animation-delay: .2s; }
.loader__dots i:nth-child(3) { animation-delay: .4s; }
@keyframes loader-dot {

}

.loader__bar {

}

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
  'use strict';

  function rand(min, max) { return Math.random() * (max - min) + min; }

  /* ---------- Photo upload / preview ---------- */
  function initPhotoSlots() {
    document.querySelectorAll('.photo-slot').forEach(function (slot) {
      var img = slot.querySelector('.photo-slot__img');
      var input = slot.querySelector('.photo-slot__input');
      if (img && img.getAttribute('src')) {
        slot.classList.add('has-image');
      }
      if (input) {
        input.addEventListener('change', function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            img.setAttribute('src', ev.target.result);
            slot.classList.add('has-image');
          };
          reader.readAsDataURL(file);
        });
      }
    });
  }

  /* ---------- Scroll reveal ---------- */
  function initReveal() {
    var targets = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      targets.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' });
    targets.forEach(function (el) { observer.observe(el); });
  }

  /* ---------- Surprise flowers: tap to bloom and reveal a message ---------- */
  function initSurpriseFlowers() {
    document.querySelectorAll('.surprise-flower').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('is-open')) return;
        btn.classList.add('is-open');

        var href = btn.getAttribute('data-href');
        var targetId = btn.getAttribute('data-target');
        var target = targetId ? document.getElementById(targetId) : null;

        if (href) {
          setTimeout(function () { showLoader('Opening your surprise'); }, 350);
          setTimeout(function () { openPage(href); }, 1300);
        } else if (target) {
          setTimeout(function () {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 350);
        }
      });
    });
  }

  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Heading: split into letters so they can rise in one by one ---------- */
  function splitLetters(el, start) {
    var text = el.textContent;
    el.textContent = '';
    el.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement('span');
      s.className = 'letter';
      s.style.setProperty('--n', start + i);
      s.textContent = text.charAt(i);
      el.appendChild(s);
    }
    return start + text.length;
  }
  function initHeading() {
    var heading = document.querySelector('.card-heading');
    if (!heading) return;
    var n = 0;
    heading.querySelectorAll('.word-happy, .word-birthday').forEach(function (word) {
      n = splitLetters(word, n);
    });
  }

  /* ---------- Ambient layers on the card: petals, gold dust, butterflies ---------- */
  var BUTTERFLY_SVG =
    '<svg class="butterfly-svg" viewBox="0 0 60 44" aria-hidden="true">' +
      '<g class="wings-left">' +
        '<path d="M30,22 C22,4 4,2 3,14 C2,24 14,28 30,22 Z"/>' +
        '<path d="M30,24 C20,30 8,34 12,41 C17,46 28,36 30,24 Z"/>' +
        '<circle cx="14" cy="13" r="2.6" fill="#fff" opacity=".5"/>' +
      '</g>' +
      '<g class="wings-right">' +
        '<path d="M30,22 C38,4 56,2 57,14 C58,24 46,28 30,22 Z"/>' +
        '<path d="M30,24 C40,30 52,34 48,41 C43,46 32,36 30,24 Z"/>' +
        '<circle cx="46" cy="13" r="2.6" fill="#fff" opacity=".5"/>' +
      '</g>' +
      '<ellipse class="body" cx="30" cy="24" rx="1.6" ry="9"/>' +
      '<line x1="30" y1="15" x2="26" y2="8" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>' +
      '<line x1="30" y1="15" x2="34" y2="8" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>' +
    '</svg>';

  var PETAL_COLORS = ['#e23e77', '#e8b4bc', '#d9909e', '#fffdfb', '#f3d9c4', '#c98a93'];
  var HEART_COLORS = ['#e23e77', '#e8b4bc', '#d9909e', '#c6a15b'];

  // cfg counts are [phone, larger screen]
  function fillAmbient(scene, cfg) {
    if (!scene) return;
    var small = window.innerWidth < 600;
    function count(pair) { return small ? pair[0] : pair[1]; }

    var petals = scene.querySelector('.petals-container');
    var dust = scene.querySelector('.particles-container');
    var flock = scene.querySelector('.butterflies-container');
    var i, el;

    for (i = 0; i < count(cfg.petals); i++) {
      el = document.createElement('div');
      el.className = 'petal';
      el.style.left = rand(0, 100).toFixed(1) + '%';
      el.style.width = rand(12, 26).toFixed(0) + 'px';
      el.style.color = PETAL_COLORS[Math.floor(rand(0, PETAL_COLORS.length))];
      el.style.opacity = rand(0.55, 0.9).toFixed(2);
      el.style.animationDuration = rand(11, 20).toFixed(1) + 's';
      el.style.animationDelay = '-' + rand(0, 20).toFixed(1) + 's';
      el.innerHTML = '<svg viewBox="0 0 40 60" aria-hidden="true"><use href="#icon-petal"></use></svg>';
      petals.appendChild(el);
    }

    for (i = 0; i < count(cfg.dust); i++) {
      el = document.createElement('div');
      el.className = 'particle';
      el.style.left = rand(0, 100).toFixed(1) + '%';
      el.style.width = el.style.height = rand(4, 10).toFixed(1) + 'px';
      el.style.animationDuration = rand(9, 16).toFixed(1) + 's';
      el.style.animationDelay = '-' + rand(0, 16).toFixed(1) + 's';
      dust.appendChild(el);
    }

    for (i = 0; i < count(cfg.hearts); i++) {
      el = document.createElement('span');
      el.className = 'rise-heart';
      el.textContent = '\u2665';
      el.style.left = rand(3, 96).toFixed(1) + '%';
      el.style.fontSize = rand(12, 24).toFixed(0) + 'px';
      el.style.color = HEART_COLORS[Math.floor(rand(0, HEART_COLORS.length))];
      el.style.animationDuration = rand(10, 18).toFixed(1) + 's';
      el.style.animationDelay = '-' + rand(0, 18).toFixed(1) + 's';
      dust.appendChild(el);
    }

    cfg.butterflies.slice(0, count(cfg.flock)).forEach(function (b, idx) {
      var bf = document.createElement('div');
      bf.className = 'butterfly-wrap ' + b.cls;
      bf.style.left = b.left;
      bf.style.top = b.top;
      bf.style.width = b.w + 'px';
      bf.style.color = b.color;
      bf.style.animationDuration = b.dur + 's';
      bf.style.animationDelay = '-' + (idx * 3.3).toFixed(1) + 's';
      bf.innerHTML = BUTTERFLY_SVG;
      flock.appendChild(bf);
    });
  }

  function initAmbient() {
    if (prefersReduced) return;
    fillAmbient(document.getElementById('card'), {
      petals: [12, 20], dust: [14, 24], hearts: [0, 0], flock: [2, 3],
      butterflies: [
        { left: '10%', top: '64%', w: 40, color: '#c6a15b', cls: 'flight-a', dur: 11 },
        { left: '74%', top: '20%', w: 34, color: '#e23e77', cls: 'flight-b', dur: 9.5 },
        { left: '58%', top: '72%', w: 30, color: '#b86e9f', cls: 'flight-b', dur: 13 }
      ]
    });
    fillAmbient(document.getElementById('portrait'), {
      petals: [8, 14], dust: [12, 20], hearts: [4, 7], flock: [2, 2],
      butterflies: [
        { left: '8%', top: '68%', w: 36, color: '#e23e77', cls: 'flight-a', dur: 12 },
        { left: '70%', top: '60%', w: 32, color: '#c6a15b', cls: 'flight-b', dur: 10.5 }
      ]
    });
  }

  /* ---------- 2nd slide: heading words + garland of hearts ---------- */
  function initSurpriseHeading() {
    var h = document.querySelector('.surprise-heading');
    if (!h) return;
    var words = h.textContent.trim().split(/\s+/);
    h.textContent = '';
    words.forEach(function (word, i) {
      var s = document.createElement('span');
      s.className = 'sw';
      s.style.setProperty('--n', i);
      s.textContent = word;
      h.appendChild(s);
      if (i < words.length - 1) h.appendChild(document.createTextNode(' '));
    });
  }

  function initGarland() {
    var g = document.getElementById('garland');
    if (!g) return;
    var small = window.innerWidth < 600;
    var n = small ? 5 : 9;
    var colors = ['#e23e77', '#c6a15b', '#d9909e', '#f3d9c4'];
    for (var i = 1; i <= n; i++) {
      var t = i / (n + 1);
      var el = document.createElement('span');
      el.className = 'garland__heart';
      el.style.left = (100 * t).toFixed(2) + '%';
      el.style.top = (4 + 184 * t * (1 - t)).toFixed(2) + '%';   // sits exactly on the string's curve
      el.style.color = colors[(i - 1) % colors.length];
      el.style.setProperty('--hs', (small ? rand(15, 20) : rand(20, 28)).toFixed(0) + 'px');
      el.style.setProperty('--t', rand(3, 5).toFixed(1) + 's');
      el.style.setProperty('--d', '-' + rand(0, 4).toFixed(1) + 's');
      el.innerHTML = '<svg viewBox="0 0 100 90"><path d="M50,85 C10,60 0,35 15,18 C28,4 48,10 50,28 C52,10 72,4 85,18 C100,35 90,60 50,85 Z" fill="currentColor"/></svg>';
      g.appendChild(el);
    }
  }

  // a slide that is scrolled out of view stops animating (saves battery)
  function initScenePause() {
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { en.target.classList.toggle('is-paused', !en.isIntersecting); });
    }, { rootMargin: '-2px 0px -2px 0px' });   // a slide that only touches the screen edge counts as out of view
    document.querySelectorAll('.scene').forEach(function (s) { io.observe(s); });
  }

  /* ---------- Tap the card for a burst of hearts ---------- */
  function initHeartBurst() {
    if (prefersReduced) return;
    var glyphs = ['\u2665', '\u2665', '\u2661', '\u2726'];
    var colors = ['#e23e77', '#e8b4bc', '#c6a15b', '#d9909e', '#8c4655'];
    ['card', 'portrait'].forEach(function (id) {
      var scene = document.getElementById(id);
      if (!scene) return;
      scene.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('.surprise-flower')) return; // those open their own page
        var box = scene.getBoundingClientRect();
        var x = e.clientX - box.left;
        var y = e.clientY - box.top;
        for (var k = 0; k < 8; k++) {
          var h = document.createElement('span');
          h.className = 'burst-heart';
          h.textContent = glyphs[Math.floor(rand(0, glyphs.length))];
          h.style.left = x + 'px';
          h.style.top = y + 'px';
          h.style.color = colors[Math.floor(rand(0, colors.length))];
          h.style.setProperty('--s', rand(14, 30).toFixed(0) + 'px');
          h.style.setProperty('--dx', rand(-80, 80).toFixed(0) + 'px');
          h.style.setProperty('--dy', rand(-190, -70).toFixed(0) + 'px');
          h.style.setProperty('--r', rand(-45, 45).toFixed(0) + 'deg');
          h.addEventListener('animationend', function () { this.remove(); });
          scene.appendChild(h);
        }
      });
    });
  }

  /* ---------- Loading screen ---------- */
  var loaderEl = null;
  var pageStarted = false;

  // Lift the "loading" state: page animations start and scroll reveals begin.
  function startPage() {
    if (pageStarted) return;
    pageStarted = true;
    document.body.classList.remove('is-loading');
    initReveal();
  }

  // Bring the loader back (used when a surprise flower opens another page).
  function showLoader(text) {
    if (!loaderEl) return;
    var label = document.getElementById('loaderText');
    if (label && text) label.textContent = text;
    loaderEl.classList.remove('is-running', 'is-complete', 'is-done');
    loaderEl.setAttribute('aria-hidden', 'false');
    void loaderEl.offsetWidth; // restart the bar from zero
    requestAnimationFrame(function () { loaderEl.classList.add('is-running'); });
  }

  var overlay = document.getElementById('pageOverlay');
  var frame = document.getElementById('pageFrame');

  function openPage(href) {
    frame.onload = function () {
      frame.onload = null;
      loaderEl.classList.add('is-complete');
      setTimeout(function () {
        loaderEl.classList.add('is-done');
        loaderEl.setAttribute('aria-hidden', 'true');
      }, 450);
    };
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    frame.src = href;
  }

  function closePage() {
    overlay.hidden = true;
    frame.src = 'about:blank';
    document.body.style.overflow = '';
    document.querySelectorAll('.surprise-flower.is-open').forEach(function (b) {
      b.classList.remove('is-open');
    });
  }

  document.getElementById('pageBack').addEventListener('click', closePage);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden) closePage();
  });

  // a child page that links to index.html closes the overlay instead of nesting the site
  window.addEventListener('message', function (e) { if (e.data === 'close-page') closePage(); });
  if (window.self !== window.top) { window.parent.postMessage('close-page', '*'); }


  function initLoader() {
    loaderEl = document.getElementById('loader');
    if (!loaderEl) { startPage(); return; }

    var finished = false;
    function reveal() {
      setTimeout(function () {
        loaderEl.classList.add('is-done');
        loaderEl.setAttribute('aria-hidden', 'true');
        startPage();
      }, 450);
    }

    function finish() {
      if (finished) return;
      finished = true;
      loaderEl.classList.remove('loader--boot');
      loaderEl.classList.add('is-complete');

      var needsTap = window.Bgm && !window.Bgm.isPlaying();
      if (!needsTap) { reveal(); return; }

      var enter = document.getElementById('enterBtn');
      var label = document.getElementById('loaderText');
      if (label) label.textContent = 'Your surprise is ready';
      enter.hidden = false;
      enter.addEventListener('click', function () {
        enter.hidden = true;
        window.Bgm.play().catch(function () {});   // this tap unlocks sound
        reveal();
      }, { once: true });
    }

    requestAnimationFrame(function () { loaderEl.classList.add('is-running'); });

    // Wait for: a short minimum (so it never flashes), the page + images, and the web fonts.
    var minWait = new Promise(function (r) { setTimeout(r, prefersReduced ? 300 : 1900); });
    var loaded = new Promise(function (r) {
      if (document.readyState === 'complete') r(); else window.addEventListener('load', r);
    });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([minWait, loaded, fonts]).then(finish);
    setTimeout(finish, 7000); // never keep her waiting on a slow connection
  }

  // Coming back with the browser's Back button: don't leave the loader or opened flower stuck.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    document.querySelectorAll('.surprise-flower.is-open').forEach(function (b) { b.classList.remove('is-open'); });
    if (loaderEl) {
      loaderEl.classList.add('is-done');
      loaderEl.setAttribute('aria-hidden', 'true');
    }
    startPage();
  });

  document.addEventListener('DOMContentLoaded', function () {
    [initLoader, initHeading, initSurpriseHeading, initPhotoSlots, initSurpriseFlowers, initAmbient, initGarland, initScenePause, initHeartBurst].forEach(function (fn) {
      try { fn(); } catch (err) { if (window.console) console.error(err); }
    });
  });
})();
</script>

<!-- The music player (button + song list) lives in music.js so every page shares it. -->
<script src="music.js"></script>
