*,

*::before {
  padding: 0;

}

:root {
  --dark-color: #000;
}

  display: flex;

  min-height: 100vh;
  background-color: var(--dark-color);

/* =========================
   BACK TO HOME BUTTON
   ========================= */

.back-button {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 9999;

  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 18px;

  border: 1px solid rgba(139, 63, 82, 0.25);
  border-radius: 999px;

  background: rgba(255, 248, 249, 0.82);
  backdrop-filter: blur(10px);

  color: #8b3f52;

  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  text-decoration: none;

  box-shadow: 0 5px 18px rgba(107, 44, 57, 0.12);

  transition:
    transform 0.3s ease,
    background 0.3s ease,
    box-shadow 0.3s ease;
}

.back-button span:first-child {
  font-family: Arial, sans-serif;
  font-size: 19px;
  line-height: 1;
}

.back-button:hover {
  transform: translateX(-3px);

  background: rgba(255, 255, 255, 0.95);

  box-shadow:
    0 8px 24px rgba(107, 44, 57, 0.18);
}

.back-button:active {
  transform: scale(0.96);
}


/* Mobile */
@media (max-width: 600px) {
  .back-button {
    top: 16px;
    left: 16px;

    padding: 8px 14px;
    font-size: 15px;
  }
}

/* ===== LOADING SCREEN ===== */
.bloom-loader{
  position:fixed;inset:0;z-index:10000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,30px);padding:6vh 8vw;text-align:center;
  background:
    radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,183,94,.22), transparent 70%),
    linear-gradient(180deg,#0b0508 0%,#1a0b12 60%,#2a1218 100%);
  transition:opacity .9s ease, visibility 0s;
}
.bloom-loader.is-done{
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .9s ease, visibility 0s .9s;
}
/* the page pauses every animation while loading; keep the loader itself moving */
.not-loaded .bloom-loader,
.not-loaded .bloom-loader *{animation-play-state:running !important}

.bloom-loader__flower{
  position:relative;width:clamp(84px,24vw,116px);aspect-ratio:1;
  display:grid;place-items:center;color:#ff8fb0;font-size:clamp(46px,13vw,64px);
  line-height:1;
}
.bloom-loader__flower span{
  display:block;filter:drop-shadow(0 0 14px rgba(255,143,176,.7));
  animation:bl-spin 6s linear infinite, bl-pulse 2.4s ease-in-out infinite;
}
.bloom-loader__ring{
  position:absolute;inset:0;border:1.5px solid #ffc35c;border-radius:50%;
  opacity:0;animation:bl-ring 2.6s ease-out infinite;
}
.bloom-loader__ring--2{border-color:#ff8fb0;animation-delay:1.3s}
.bloom-loader__title{
  font-family:'Parisienne',cursive;font-weight:400;
  font-size:clamp(1.9rem,8vw,3rem);line-height:1.25;color:#ffe9d6;
  text-shadow:0 0 24px rgba(255,183,94,.45);
}
.bloom-loader__dots i{display:inline-block;font-style:normal;animation:bl-dot 1.4s ease-in-out infinite}
.bloom-loader__dots i:nth-child(2){animation-delay:.2s}
.bloom-loader__dots i:nth-child(3){animation-delay:.4s}
.bloom-loader__bar{
  width:min(58vw,240px);height:3px;border-radius:3px;
  background:rgba(255,233,214,.15);overflow:hidden;
}
.bloom-loader__bar span{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,#ffc35c,#ff8fb0);
  animation:bl-bar 2.6s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes bl-spin{to{transform:rotate(360deg)}}
@keyframes bl-pulse{0%,100%{scale:.85}50%{scale:1.12}}
@keyframes bl-ring{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes bl-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-.15em)}}
@keyframes bl-bar{to{width:100%}}

/* ===== FIREWORKS (behind the flowers) ===== */
#fireworks{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
}

/* ===== HAPPY BIRTHDAY OVERLAY ===== */
.hb{
  --hb-size: clamp(3.4rem, min(19vw, 15vmin), 12rem);  /* title size */
  --hb-lift: 73vmin;                                    /* how high above the bottom the title sits */
  position:fixed; left:50%; bottom:var(--hb-lift);
  width:max-content; max-width:96vw;
  transform:translateX(-50%);
  z-index:60; pointer-events:none; text-align:center;
  font-family:'Parisienne','Great Vibes','Brush Script MT',cursive;
  font-size:var(--hb-size); line-height:1;
  opacity:0;
  animation:hb-in 1.8s cubic-bezier(.22,.61,.36,1) 6.6s forwards;
}
@media (orientation: portrait){
  .hb{ --hb-size: clamp(2.8rem, 19vw, 8rem); }
}

.hb__float{ position:relative; animation:hb-float 7s ease-in-out infinite; will-change:transform; }
.hb__title{ font-size:1em; font-weight:400; }

.hb__word{ position:relative; display:block; isolation:isolate; white-space:nowrap; }
.hb__word--happy{ font-size:.58em; }
.hb__word--bday{ font-size:1em; margin-top:-.16em; }

/* soft bloom behind the letters (a text-shadow, not an animated blur filter) */
.hb__word::before{
  content:attr(data-text);
  position:absolute; inset:0; z-index:-2; display:block;
  padding:.08em .2em .18em; text-align:center; line-height:1;
  color:transparent; -webkit-text-fill-color:transparent;
  text-shadow:0 0 .32em var(--glow), 0 0 .14em var(--glow);
  animation:hb-glow 4.2s ease-in-out infinite;
  will-change:opacity;
}
.hb__word--happy{ --glow:rgba(255,208,130,.8); }
.hb__word--bday{ --glow:rgba(255,150,182,.75); }
.hb__word--bday::before{ animation-delay:-1.6s; }

/* thick "extrusion" edge: an invisible copy of the text under the lettering that only casts its stacked shadows */
.hb__word::after{
  content:attr(data-text);
  position:absolute; inset:0; z-index:-1; display:block;
  padding:.1em .22em .3em; text-align:center; line-height:1;
  color:transparent; -webkit-text-fill-color:transparent;
}
.hb__word--happy::after{
  text-shadow:0 .014em 0 #d9a552, 0 .028em 0 #c98f3f, 0 .05em .04em rgba(50,15,10,.6), 0 0 .14em rgba(255,214,140,.6);
}
.hb__word--bday::after{
  text-shadow:0 .014em 0 #e07f9f, 0 .028em 0 #b9456a, 0 .05em .04em rgba(50,15,10,.6), 0 0 .16em rgba(255,140,175,.55);
}

/* the lettering: gradient fill, thick "extrusion" edge, shine sweep */
.hb__ink{
  display:block; padding:.08em .2em .18em; line-height:1;
  color:transparent; -webkit-text-fill-color:transparent;
  -webkit-background-clip:text; background-clip:text;
  background-repeat:no-repeat;
  background-size:260% 100%, 100% 100%;
  background-position:130% 0, 0 0;
  animation:hb-shine 7s ease-in-out 8.6s infinite;
}
.hb__word--happy .hb__ink{
  background-image:
    linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%),
    linear-gradient(180deg, #fffdf4 0%, #fff0d2 48%, #f5d08c 100%);
}
.hb__word--bday .hb__ink{
  background-image:
    linear-gradient(105deg, transparent 42%, rgba(255,255,255,.85) 50%, transparent 58%),
    linear-gradient(180deg, #ffd3de 0%, #f8a9bf 50%, #ffc7a6 100%);
}

/* hearts, stars, swashes */
.hb__deco{ position:absolute; pointer-events:none; }
.hb__deco svg{ display:block; width:100%; height:auto; overflow:visible; }

.hb__heart{ animation:hb-bob 3.6s ease-in-out infinite; transform:rotate(var(--tilt,0deg)); }
.hb__heart--a{ width:.2em;  left:24%; top:2%;   --tilt:-14deg; }
.hb__heart--b{ width:.13em; right:-2%; top:34%; --tilt:14deg; animation-delay:-1.4s; }

.hb__star{ animation:hb-twinkle 2.6s ease-in-out infinite; color:#f6d27a; }
.hb__star svg{ filter:drop-shadow(0 0 .04em rgba(255,214,120,.9)); }
.hb__star--a{ width:.2em;  right:20%; top:-2%; }
.hb__star--b{ width:.14em; left:-4%;  top:44%;    animation-delay:-.9s; }
.hb__star--c{ width:.1em;  right:-3%; bottom:20%; animation-delay:-1.7s; }

.hb__swash{ width:.55em; animation:hb-sway 5s ease-in-out infinite; }
.hb__swash--l{ left:-9%;  bottom:10%; }
.hb__swash--r{ right:-9%; bottom:12%; transform:scaleX(-1); animation-name:hb-sway-r; }
.hb__swash path{ fill:none; stroke-linecap:round; }

/* tiny drifting gold dust (created by script) */
.hb__dust{ position:absolute; inset:-10% -12% -6%; pointer-events:none; }
.hb__dust i{
  position:absolute; width:var(--s); height:var(--s); border-radius:50%;
  background:radial-gradient(circle,#fff6d8,#ffd98a 45%,transparent 70%);
  opacity:0; animation:hb-dust var(--d) ease-in-out var(--dl) infinite;
}

@keyframes hb-in{ from{opacity:0} to{opacity:1} }
@keyframes hb-float{
  0%,100%{ transform:translateY(0) rotate(-.5deg); }
  50%    { transform:translateY(-.08em) rotate(.5deg); }
}
@keyframes hb-glow{ 0%,100%{opacity:.5} 50%{opacity:1} }
@keyframes hb-shine{
  0%,55%{ background-position:130% 0, 0 0; }
  100%  { background-position:-30% 0, 0 0; }
}
@keyframes hb-bob{
  0%,100%{ transform:translateY(0) rotate(var(--tilt,0deg)) scale(1); }
  50%    { transform:translateY(-.03em) rotate(var(--tilt,0deg)) scale(1.1); }
}
@keyframes hb-twinkle{
  0%,100%{ opacity:.4; transform:scale(.8) rotate(0deg); }
  50%    { opacity:1;  transform:scale(1.15) rotate(12deg); }
}
@keyframes hb-sway{
  0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg) translateY(-.01em); }
}
@keyframes hb-sway-r{
  0%,100%{ transform:scaleX(-1) rotate(-2deg); } 50%{ transform:scaleX(-1) rotate(2deg) translateY(-.01em); }
}
@keyframes hb-dust{
  0%  { opacity:0; transform:translateY(0) scale(.6); }
  40% { opacity:.95; }
  100%{ opacity:0; transform:translateY(-.35em) scale(1.1); }
}

@media (prefers-reduced-motion: reduce){
  .hb{ opacity:1; animation:none; }
  .hb *, .hb *::before{ animation:none !important; }
}

/* ===== FLOWERS: SMALLER ===== */
.flowers{ transform: scale(.74); transform-origin: 50% 100%; }

/* ===== HAPPY BIRTHDAY: BIGGER, BOLDER ===== */
.hb{
  --hb-size: clamp(3.4rem, min(16.5vmin, 12.5vw), 15rem);
  --hb-lift: 66vmin;   /* raise if it touches the flower tops, lower if the gap is too big */
  font-family:'Pacifico','Parisienne','Brush Script MT',cursive;
  letter-spacing:.01em;
}
@media (orientation: portrait){
  .hb{ --hb-size: clamp(3rem, 21vw, 10rem); --hb-lift: 71vmin; }
  .flowers{ transform: scale(.8); }
}

/* extra room so the tall script never gets clipped */
.hb__ink{ padding:.1em .22em .3em; will-change:transform; }
.hb__word::before{ padding:.1em .22em .3em; }
.hb__word--happy{ font-size:.6em; }
.hb__word--bday{ margin-top:-.3em; }

/* stacked edges for a thicker 3D look */
.hb__word--happy .hb__ink{
}
.hb__word--bday .hb__ink{
}

/* bigger hearts, stars and swashes, placed like your reference */
.hb__heart--a{ width:.26em; left:22%;  top:4%; }
.hb__heart--b{ width:.17em; right:1%;  top:40%; }
.hb__star--a { width:.26em; right:6%;  top:6%; }
.hb__star--b { width:.2em;  left:-2%;  top:46%; }
.hb__star--c { width:.16em; right:8%;  bottom:14%; }
.hb__swash   { width:.7em; }
</style>

  <script>
  (function () {
    'use strict';

    var FLOWERS_DONE_MS = 7200;   // how long the bouquet takes to finish blooming
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var loader = document.getElementById('bloomLoader');
    var canvas = document.getElementById('fireworks');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, Q = 1;

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      // 1 canvas pixel per CSS pixel is plenty for glowing sparks (retina would be 4x the work); cap the total too
      Q = Math.min(1, Math.sqrt(1100000 / (W * H)));
      canvas.width = Math.round(W * Q); canvas.height = Math.round(H * Q);
      ctx.setTransform(Q, 0, 0, Q, 0, 0);
    }
    resize();
    var resizeTimer = 0;
    window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

    function rand(a, b) { return Math.random() * (b - a) + a; }

    /* ---------- fireworks ---------- */
    var rockets = [], sparks = [], running = false, nextLaunch = 0, last = 0, lastRaf = 0;
    var q = 1, slow = 0;            // quality 1 -> 0.3: shrinks automatically if the device can't keep up
    var HUES = [340, 320, 42, 28, 290, 200, 55];
    var MAX_SPARKS = 380;

    function launch() {
      rockets.push({
        x: rand(W * 0.12, W * 0.88), y: H,
        px: 0, py: H,
        vy: -rand(H * 0.011, H * 0.015),
        targetY: rand(H * 0.12, H * 0.42),
        hue: HUES[Math.floor(rand(0, HUES.length))]
      });
    }

    function explode(r) {
      var count = Math.max(10, Math.round((W < 600 ? 38 : 56) * q));
      var ring = Math.random() < 0.4;              // some bursts are perfect rings
      for (var i = 0; i < count; i++) {
        var ang = (Math.PI * 2 * i) / count + rand(-0.05, 0.05);
        var sp = ring ? rand(3.6, 4) : rand(1, 4.6);
        var hue = r.hue + rand(-12, 12);
        sparks.push({
          x: r.x, y: r.y,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          life: 1, decay: rand(0.010, 0.019),
          col: 'hsl(' + hue.toFixed(0) + ',100%,72%)', size: rand(1.4, 2.6)
        });
      }
    }

    function frame(t) {
      if (!running) return;
      requestAnimationFrame(frame);

      // adaptive quality: if the whole page keeps running below ~21 fps, do less; a fast phone never triggers this
      var raw = t - lastRaf; lastRaf = t;
      if (raw > 48 && raw < 1000) slow++; else if (raw < 36 && slow > 0) slow--;
      if (slow > 24) {
        slow = 0;
        if (q > 0.31) q = Math.max(0.3, q * 0.7);
        else { running = false; canvas.style.display = 'none'; return; }   // still struggling at the lowest setting: switch off
      }

      var dt = t - last;
      if (dt < 30) return;                          // ~30 fps is plenty for fireworks and half the work
      last = t;
      var k = Math.min(dt, 70) / 16.667;            // same speed whatever the frame rate
      var fric = Math.pow(0.975, k), drag = Math.pow(0.985, k), fade = 1 - Math.pow(0.78, k);

      // fade old trails while keeping the canvas transparent
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,' + fade.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      if (t > nextLaunch && sparks.length < MAX_SPARKS * q) {
        launch();
        if (Math.random() < 0.35) launch();
        nextLaunch = t + rand(650, 1500) / q;
      }

      ctx.lineWidth = 2;
      for (var i = rockets.length - 1; i >= 0; i--) {
        var r = rockets[i];
        r.px = r.x; r.py = r.y;
        r.y += r.vy * k;
        r.vy *= drag;
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = 'hsl(' + r.hue + ',100%,80%)';
        ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(r.x, r.y); ctx.stroke();
        if (r.y <= r.targetY || r.vy > -1.2) { explode(r); rockets.splice(i, 1); }
      }

      for (var j = sparks.length - 1; j >= 0; j--) {
        var s = sparks[j];
        s.x += s.vx * k; s.y += s.vy * k;
        s.vx *= fric; s.vy = s.vy * fric + 0.045 * k;   // friction + gravity
        s.life -= s.decay * k;
        if (s.life <= 0) { sparks.splice(j, 1); continue; }
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.col;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (0.5 + s.life * 0.6), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function startFireworks() {
      if (reduced || running) return;
      running = true;
      last = 0; lastRaf = 0;
      nextLaunch = 0;
      requestAnimationFrame(frame);
    }

    /* ---------- loading screen, then bloom, then fireworks ---------- */
    var revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      loader.classList.add('is-done');
      loader.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('not-loaded');       // flowers start growing now
      setTimeout(startFireworks, FLOWERS_DONE_MS);        // fireworks once they're finished
    }

    var minWait = new Promise(function (r) { setTimeout(r, reduced ? 400 : 2600); });
    var loaded = new Promise(function (r) {
      if (document.readyState === 'complete') r(); else window.addEventListener('load', r);
    });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([minWait, loaded, fonts]).then(reveal);
    setTimeout(reveal, 6000);   // never keep her waiting on a slow connection
  })();
  </script>

  (function () {

    function rand(a, b) { return Math.random() * (b - a) + a; }

      s.style.top  = rand(0, 100).toFixed(1) + '%';
      s.style.setProperty('--s',  rand(0.02, 0.055).toFixed(3) + 'em');
      s.style.setProperty('--d',  rand(3, 6).toFixed(1) + 's');
      s.style.setProperty('--dl', '-' + rand(0, 6).toFixed(1) + 's');
      box.appendChild(s);
    }
  })();
